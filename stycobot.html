<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="StycoBot - An AI-powered chatbot for Styco" />
        <meta name="author" content="Ruzan Sasuri" />
        <title>StycoBot - Ruzan Sasuri's portfolio</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Custom Google font-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
        <!-- Universal Sans Font -->
        <link href="assets/fonts/UniversalSans.css" rel="stylesheet" />
        <!-- Inter Font -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <!-- Chatbot Fonts -->
        <link href="assets/fonts/stycobot-fonts.css" rel="stylesheet" />
    </head>
    <body class="d-flex flex-column h-100 bg-light">
        <!-- Metrics panel(hidden on load)-->
        <div id="react-modal" class="react-modal">
            <div class="react-modal-content">
                <button id="close-react-modal" class="react-modal-close">✖</button>
                <!-- Loading gif -->
                <div id="iframe-loader" class="iframe-loader">
                    <img src="assets/gear.gif" alt="Loading...">
                    <p>Loading...</p>
                </div>
                <iframe id="react-iframe" src="" frameborder="0"></iframe>
            </div>
        </div>
        <!-- Page Content-->
        <main class="flex-shrink-0">
            <div class="container px-5 my-5">
                <div class="text-center mb-5">
                    <h1 class="display-5 fw-bolder mb-0"><span class="text-gradient d-inline">StycoBot</span></h1>
                    <p class="lead fw-light mb-4">An AI-powered chatbot for Styco</p>
                    <button id="open-react-panel" class="btn btn-outline-primary">
                        <i class="bi bi-bar-chart" style="margin-right: 8px;"></i>Open Analytics
                    </button>
                </div>
                
                <div class="row gx-5 justify-content-center">
                    <div class="col-lg-11 col-xl-9 col-xxl-8">
                        <div class="card shadow border-0 rounded-4 mb-5">
                            <div class="card-body p-5">                                    
                                <div class="chatbot-container">
                                    <div class="chatbot-header">
                                        <i class="bi bi-robot"></i>
                                        StycoBot
                                    </div>
                                    <div class="chatbot-messages" id="chatMessages">
                                        <div class="chatbot-message bot">
                                            <div class="chatbot-bubble" id="welcomeMessage">
                                                <!-- Welcome message will be set by JavaScript -->
                                            </div>
                                        </div>
                                    </div>
                                    <div class="chatbot-input-area">    
                                        <form id="chatForm">
                                            <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
                                            <button type="submit" class="btn btn-primary">
                                                <i class="bi bi-send"></i>
                                            </button>
                                        </form>
                                        <div id="errorMessage" class="error-message" style="display: none;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <!-- Footer-->
        <footer class="bg-white py-4 mt-auto">
            <div class="container px-5">
                <div class="row align-items-center justify-content-between flex-column flex-sm-row">
                    <div class="col-auto"><a class="small" href="contact">Contact</a></div>
                </div>
            </div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="js/scripts.js"></script>
        <!-- Navbar JS-->
        <script src="js/navbar.js"></script>
        <!-- Chatbot JS-->
        <script src="js/stycobot.js"></script>
        <!-- Metrics Panel JS-->
        <script src="js/stycobotmetrics.js"></script>
    </body>
</html>
